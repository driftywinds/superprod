name: superprod
description: "A fast, local-first Android client for Super Productivity, with SuperSync."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.1.0

  # Local-first storage: SQLite with typed queries.
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39

  # State
  flutter_riverpod: ^3.0.3

  # Navigation (back gesture aware)
  go_router: ^16.2.4

  # HTTP for SuperSync
  dio: ^5.9.0

  # Utils
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.3
  drift_dev: ^2.28.2

flutter:
  uses-material-design: true
