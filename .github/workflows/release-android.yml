name: Release Android

# Trigger from a pushed tag (v1.2.3) or manually with an explicit version.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3 (the tag and app version both use it)'
        required: true
        type: string
      create_release:
        description: 'Also create a GitHub release for this version'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Matches the pnpm that wrote pnpm-lock.yaml (pnpm 11).
  PNPM_VERSION: '11'

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi

          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$RAW' is not a semver version (expected MAJOR.MINOR.PATCH, optionally prefixed with v)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu runner image ships the Android SDK. Do not use
      # android-actions/setup-android: its default package list still asks
      # sdkmanager for "tools", which no longer exists and fails the job.
      - name: Prepare the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK at $SDK"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK"

          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found; relying on preinstalled packages"
            exit 0
          fi

          # Capacitor 7 compiles against API 35. Accept licenses and make sure
          # the platform is present so Gradle does not fail on a fresh image.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp the version
        run: node tools/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build web assets
        run: pnpm build

      # The Android platform is generated, not committed, so a fresh checkout
      # always produces it from the current Capacitor config.
      - name: Generate the Android platform
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      - name: Re-stamp the version after platform generation
        run: node tools/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

          node tools/android-release-config.mjs

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Name artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/superprod-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/superprod-$VERSION.aab"
          ls -lh artifacts

      - name: Verify the APK version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "${ANDROID_SDK_ROOT}" -name aapt2 -type f | head -n 1)
          if [ -z "$AAPT" ]; then
            echo "::warning::aapt2 not found; skipping the version cross-check"
            exit 0
          fi
          "$AAPT" dump badging "artifacts/superprod-${{ steps.version.outputs.version }}.apk" \
            | grep -E "^package:|versionName" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superprod-${{ steps.version.outputs.version }}
          path: artifacts/*
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: superprod ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
